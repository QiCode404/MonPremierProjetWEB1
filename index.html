<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <!-- Application du thème sombre/claire -->
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "clair";
            if (theme === "sombre") {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <!-- CSS Bootstrap & style CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Promo ENI - Accueil</title>
</head>

<body>

<header class="py-3">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start gap-3">
    <img src="Ressources-ProjetWEBJanvier/logo.png" alt="Logo ENI" class="logo">

    <h1 id="promo-name" class="m-0">Promo EDWM2511FT</h1>

    <nav class="d-flex flex-wrap justify-content-center gap-3">
      <a href="index.html">Accueil</a>
      <a href="preferences.html">Préférences</a>
      <a href="carte.html">Carte</a>
      <a href="informations.html">Informations</a>
    </nav>
  </div>
</header>



<!-- Titre + fieldset alignés -->
<div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start gap-3">
    <h1 class="m-0">Liste des apprenants</h1>

    <div class="display-div">
        <p>Type affichage</p>
        <input type="radio" name="display" id="rad-list" value="liste">
        <label for="rad-list">Liste</label>
        <input type="radio" name="display" id="rad-grid" value="cartes">
        <label for="rad-grid">Cartes</label>
    </div>
</div>

<main class="container align-items-center flex-column mt-4 text-center text-md-start">

    <!-- LISTE (TABLEAU) -->
    <div id="listContainer" class="table-wrapper">
        <div class="table-scroll table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Ville</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tbodyApprenants"></tbody>
            </table>
        </div>
    </div>

    <!-- GRID (CARTES) -->
    <div id="gridApprenants" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" style="display:none;"></div>

    <!-- MODAL DETAIL APPRENANT -->
<div class="modal fade" id="modalDetail" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Détail apprenant</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center" id="modalContent">
                <!-- Contenu injecté par JS -->
            </div>

        </div>
    </div>
</div>

</main>
<!-- JS principal -->
<script type="module" src="js/app.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
