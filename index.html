<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <!-- Application du thème sombre/claire -->
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "clair";
            if (theme === "sombre") {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <!-- CSS Bootstrap & style CSS classique -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Promo ENI - Accueil</title>
</head>

<body>

<!-- MODAL DETAIL APPRENANT -->
<div class="modal fade" id="modalDetail" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Détail apprenant</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center" id="modalContent">
                <!-- Contenu injecté par JS -->
            </div>

        </div>
    </div>
</div>

<header>
    <div class="container d-flex justify-content-between align-items-center">
        <img src="Ressources-ProjetWEBJanvier/logo.png" alt="Logo ENI" class="logo">
        <h2 class="m-0">Promo EDWM2511FT</h2>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="preferences.html">Préférences</a>
            <a href="carte.html">Carte</a>
            <a href="informations.html">Informations</a>
        </nav>
    </div>
</header>

<!-- Titre + fieldset alignés -->
<div class="container d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Liste des apprenants</h1>

    <fieldset class="display-div d-inline-block">
        <p>Type affichage</p>
        <input type="radio" name="display" id="rad-list" checked>
        <label for="rad-list">Liste</label>
        <input type="radio" name="display" id="rad-grid">
        <label for="rad-grid">Cartes</label>
    </fieldset>
</div>

<main class="container">
    <div id="listeApprenants"></div>
</main>

<!-- JS -->
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
