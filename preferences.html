<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Promo ENI - Préférences</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<header>
    <img src="Ressources-ProjetWEBJanvier/logo.png" alt="Logo ENI" class="logo">
    <nav>
        <a href="index.html">Accueil</a>
        <a href="preferences.html">Préférences</a>
        <a href="carte.html">Carte</a>
        <a href="informations.html">Informations</a>
    </nav>
</header>

<main>
    <fieldset>
                <legend>Préférences du site</legend>
                <form id="settings-form">
                    <div id="grid-container-form">
                        <label for="theme">Thème du site</label>
                        <select name="theme" id="theme">
                            <option value="light">Clair</option>
                            <option value="dark">Sombre</option>
                        </select>
                    </div>

    <div>
        <label for="affichage">Format d'affichage</label>
        <label><input type="radio" name="affichage" value="liste"> Liste</label>
        <label><input type="radio" name="affichage" value="cartes"> Cartes</label>
    </div>
    </fieldset>

   <button type="button" class="btn btn-secondary">Enregistrer</button>
</main>

<script src="js/preferences.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
