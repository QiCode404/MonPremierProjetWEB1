<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <title>Promo ENI - Préférences</title>
 <script>
  (function() {
    const theme = localStorage.getItem("theme") || "clair";
    if (theme === "sombre") {
      document.documentElement.classList.add("dark");
    }
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

  </head>

<body>
<header class="py-3">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start gap-3">
    <img src="Ressources-ProjetWEBJanvier/logo.png" alt="Logo ENI" class="logo">

    <h1 id="promo-name" class="m-0">Promo EDWM2511FT</h1>

    <nav class="d-flex flex-wrap justify-content-center gap-3">
      <a href="index.html">Accueil</a>
      <a href="preferences.html">Préférences</a>
      <a href="carte.html">Carte</a>
      <a href="informations.html">Informations</a>
    </nav>
  </div>
</header>


<main class="container align-items-center flex-column mt-4 text-center text-md-start">
  <form>
    <h1>Préférences du site</h1>
    <section class="mb-4">
        <div class="mb-3">
          <h4>Thème du site</h4>
            <label for="themeSelect" class="form-label"></label>
            <select id="themeSelect" class="form-select form-select-sm custom-theme-select">
                <option value="clair">Clair</option>
                <option value="sombre">Sombre</option>
            </select>
        </div>

    </section>
    <section class="mb-4">
        <h4>Format d'affichage</h4>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="affichage" id="aff-liste" value="liste" checked>
            <label class="form-check-label" for="aff-liste">Liste</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="affichage" id="aff-cartes" value="cartes">
            <label class="form-check-label" for="aff-cartes">Cartes</label>
        </div>
    </section>
    <div class="d-flex gap-3 mt-3">
      <a href="index.html" class="btn btn-outline-primary">Retour à la page d'Accueil</a>
      <button id="btnSave" class="btn btn-outline-secondary" type="submit">Enregistrer</button>
    </div>
  </form>

  </main>


<script type="module" src="js/preferences.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
