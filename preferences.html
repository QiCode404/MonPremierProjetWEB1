<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Promo ENI - Préférences</title>
 <script>
  (function() {
    const theme = localStorage.getItem("theme") || "clair";
    if (theme === "sombre") {
      document.documentElement.classList.add("dark");
    }
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

  </head>

<body>
<header>
  <div class="container d-flex justify-content-between align-items-center">
    <img src="Ressources-ProjetWEBJanvier/logo.png" alt="Logo ENI" class="logo">
    <h1 id="promo-name">Promo EDWM2511FT</h1>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="preferences.html">Préférences</a>
        <a href="carte.html">Carte</a>
        <a href="informations.html">Informations</a>
    </nav>
  </div>
</header>

<main class="container d-flex align-items-center flex-column">
    <h1>Préférences du site</h1>

    <section class="mb-4">
        <h2>Thème du site</h2>
        <div class="form-check">
    <input class="form-check-input" type="radio" name="theme" id="theme-clair" value="clair" checked>
    <label class="form-check-label" for="theme-clair">Clair</label>
</div>
<div class="form-check">
    <input class="form-check-input" type="radio" name="theme" id="theme-sombre" value="sombre">
    <label class="form-check-label" for="theme-sombre">Sombre</label>
</div>

    </section>

    <section class="mb-4">
        <h2>Format d'affichage</h2>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="affichage" id="aff-liste" value="liste" checked>
            <label class="form-check-label" for="aff-liste">Liste</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="affichage" id="aff-cartes" value="cartes">
            <label class="form-check-label" for="aff-cartes">Cartes</label>
        </div>
    </section>

    <button id="btnSave" class="btn btn-outline-secondary">Enregistrer</button>
    <a href="index.html" class="btn btn-outline-primary">Retour à la page d'Accueil</a>
  </main>


<script src="js/preferences.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
